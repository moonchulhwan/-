<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>시간의 탑 3D · 전투 시험장</title><style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d18;color:#f2ead9;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;pointer-events:none;z-index:4}#name{font-weight:900;letter-spacing:2px;font-size:14px;text-shadow:0 2px 8px #000}#bar{margin-top:7px;width:min(250px,57vw);height:12px;border:1px solid #b1a28a;background:#28222a;border-radius:8px;overflow:hidden}#hp{height:100%;width:100%;background:linear-gradient(90deg,#9d2839,#f46d63)}#status{margin-top:8px;font-size:12px;color:#d5d4d9;text-shadow:0 1px 5px black;max-width:80vw}#msg{position:fixed;top:20%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 2px 12px #000;font-weight:800;color:#e9ce8e;z-index:5;min-width:240px}#joystick{position:fixed;left:22px;bottom:max(28px,env(safe-area-inset-bottom));width:130px;height:130px;border:2px solid #9cb2c477;border-radius:50%;background:#26344b77;z-index:6}#knob{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#a1bdd7aa;border:2px solid #d5edff}#buttons{position:fixed;right:14px;bottom:max(24px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,66px);gap:9px;z-index:6}.action{width:66px;height:66px;border-radius:50%;border:2px solid #d8c6a9aa;background:#253b59d9;color:white;font-size:12px;font-weight:800;box-shadow:0 3px 12px #0008}.action:active,.action.down{background:#987c4b}#attack{background:#803e48dd}#guard{background:#396178dd}#rewind{background:#534a86dd}#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050915dc;z-index:10;padding:20px}#card{max-width:420px;width:100%;padding:28px 23px;background:linear-gradient(160deg,#202d43,#0f1628);border:1px solid #b89b69;border-radius:17px;box-shadow:0 12px 70px #000}h1{font-size:28px;margin:0 0 10px;color:#eed5a2}p{line-height:1.7;font-size:14px;color:#c9d2e1}#start{background:#bda06a;color:#111827;border:0;padding:13px 20px;border-radius:8px;font-weight:900;font-size:16px;width:100%;margin-top:12px}#loading{font-size:12px;color:#c6d4e8;margin-top:10px}#footer{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#c4d1e2aa;pointer-events:none;z-index:3;white-space:nowrap}@media(min-width:850px){#joystick{opacity:.5}#buttons{opacity:.8}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="hud"><div id="name">시간의 탑 · 3D 전투 시험장</div><div id="bar"><div id="hp"></div></div><div id="status">방어 직후 0.25초 패링 · 강타는 공격 길게 누르기</div></div><div id="msg"></div><div id="joystick"><div id="knob"></div></div><div id="buttons"><button class="action" id="attack">공격</button><button class="action" id="guard">방어</button><button class="action" id="rewind">역행</button><button class="action" id="interact">상호작용</button></div><div id="footer">3D 프로토타입 v0.1 · Wi-Fi 권장</div><div id="panel"><div id="card"><h1>시간의 탑 3D</h1><p>시간의 기사가 폐허의 수호자들과 맞서는 첫 번째 3D 전투 시험장.<br><br>왼쪽 스틱 이동 · 공격 길게 누르면 강타 · 방어 직후 패링 · 역행은 3초 전 위치와 체력 회복.<br><br>적 3명을 쓰러뜨린 뒤 빛나는 시간의 문에 다가가 상호작용해.</p><button id="start" disabled>모델 불러오는 중…</button><div id="loading">3D 캐릭터와 전투장을 준비하고 있어.</div></div></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1322);scene.fog=new THREE.FogExp2(0x0c1322,.027);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,120);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fb9ed,0x34251e,2.0));const sun=new THREE.DirectionalLight(0xffd3a0,2.7);sun.position.set(-6,13,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(27,27),new THREE.MeshStandardMaterial({color:0x34404d,roughness:.96}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const box=(w,h,d,c,x,y,z,cast=true)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m};for(let i=-12;i<=12;i+=2){for(let j=-12;j<=12;j+=2){if(Math.abs(i)>10||Math.abs(j)>10)continue;box(1.94,.025,1.94,((i+j)/2)%3===0?0x3a4554:0x313d4c,i,.005,j,false)}}for(let i=-12;i<=12;i+=3){box(1.9,1.2,1.7,0x253043,i,.6,-13);box(1.9,1.2,1.7,0x253043,i,.6,13);box(1.7,1.2,1.9,0x253043,-13,.6,i);box(1.7,1.2,1.9,0x253043,13,.6,i)}for(const [x,z] of [[-9,-9],[9,-9],[-9,9],[9,9]]){box(1.4,3,1.4,0x536074,x,1.5,z);let flame=new THREE.PointLight(0xffa45d,3,9);flame.position.set(x,3.5,z);scene.add(flame);let m=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),new THREE.MeshBasicMaterial({color:0xffb966}));m.position.copy(flame.position);scene.add(m)}
const portal=new THREE.Group();portal.position.set(0,0,-10);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,.14,12,48),new THREE.MeshStandardMaterial({color:0x8edcff,emissive:0x3ca8ff,emissiveIntensity:2,metalness:.5}));ring.position.y=1.6;portal.add(ring);const core=new THREE.Mesh(new THREE.PlaneGeometry(2.3,2.9),new THREE.MeshBasicMaterial({color:0x6bc8ff,transparent:true,opacity:.18,side:THREE.DoubleSide}));core.position.y=1.6;portal.add(core);scene.add(portal);portal.visible=false;
const loader=new GLTFLoader(),modelFiles=['01_time_knight_hero.glb','02_forgotten_soldier.glb','03_ruin_archer.glb','04_charging_lancer.glb'];let models=[];const load=async f=>{let gltf=await loader.loadAsync('./models/'+f);let g=gltf.scene;g.rotation.x=-Math.PI/2;g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g};try{models=await Promise.all(modelFiles.map(load));$('start').disabled=false;$('start').textContent='전투 시작';$('loading').textContent='3D 모델 4종 로드 완료 · 인터넷 연결 필요';}catch(err){$('loading').textContent='모델 로딩 실패: '+err.message;$('start').textContent='다시 시도하려면 새로고침';console.error(err)}
const makeModel=(id,x,z,scale=1)=>{const root=new THREE.Group(),model=models[id].clone(true);model.scale.setScalar(scale);root.add(model);root.position.set(x,0,z);scene.add(root);return root};let hero,enemies=[],effects=[],history=[],hp=100,guard=false,guardAt=0,charging=0,attackAt=-10,started=false,finished=false,last=performance.now()/1000,clock=0,keys={},stick={x:0,y:0},facing=new THREE.Vector3(0,0,-1),messageUntil=0,parryGlow=0,hitFlash=0;const message=(t,d=1.3)=>{$('msg').textContent=t;messageUntil=clock+d};const mat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.9,depthWrite:false});function fx(x,z,color=0xffd47c,size=.3){for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.07+Math.random()*.09,6,4),mat(color));m.position.set(x,.8+Math.random(),z);scene.add(m);effects.push({m,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5),life:.45+Math.random()*.3,size});}}
function reset(){if(!models.length)return;hero&&scene.remove(hero);for(const e of enemies)scene.remove(e.root);for(const e of effects)scene.remove(e.m);effects=[];hero=makeModel(0,0,6);hp=100;guard=false;history=[];enemies=[{root:makeModel(1,-5,-3),type:'soldier',hp:65,cd:1.2,wind:0,phase:0},{root:makeModel(2,5,-5),type:'archer',hp:48,cd:2.1,wind:0,phase:0},{root:makeModel(3,0,-7),type:'lancer',hp:85,cd:2.7,wind:0,phase:0}];portal.visible=false;finished=false;started=true;clock=0;charging=0;attackAt=-10;message('폐허의 기사들을 처치하라',2);$('panel').style.display='none';$('hp').style.width='100%'}$('start').onclick=reset;
function attack(heavy=false){if(!started||finished||clock-attackAt<(heavy?.75:.31))return;attackAt=clock;const p=hero.position;const range=heavy?3.7:2.65;fx(p.x+facing.x*1.1,p.z+facing.z*1.1,heavy?0x69c9ff:0xffdb9d);hero.scale.set(heavy?1.12:1,1,heavy?1.12:1);for(const e of enemies){if(e.hp<=0)continue;const v=e.root.position.clone().sub(p);v.y=0;if(v.length()<range&&v.normalize().dot(facing)>(heavy?-.3:-.1)){e.hp-=heavy?44:25;e.root.position.addScaledVector(facing,heavy?1.2:.55);fx(e.root.position.x,e.root.position.z,0xff7b5e);if(e.hp<=0){scene.remove(e.root);message('적 처치 · '+enemies.filter(q=>q.hp>0).length+'명 남음')}}}if(enemies.every(e=>e.hp<=0)){portal.visible=true;message('시간의 문이 열렸다! 문으로 이동하라',3)}}
function hurt(d,e){if(guard){const v=e.root.position.clone().sub(hero.position);v.y=0;if(v.lengthSq()>.01&&v.normalize().dot(facing)>.0){if(clock-guardAt<.25){e.wind=0;e.cd=1.7;e.hp-=20;parryGlow=.45;fx(hero.position.x,hero.position.z,0x65ddff);message('완벽한 패링!');if(e.hp<=0){scene.remove(e.root);if(enemies.every(q=>q.hp<=0)){portal.visible=true;message('시간의 문이 열렸다!',3)}}return}d*=.22}}hp=Math.max(0,hp-d);hitFlash=.3;fx(hero.position.x,hero.position.z,0xff5050);$('hp').style.width=hp+'%';if(hp<=0){started=false;$('panel').style.display='flex';$('card').querySelector('h1').textContent='시간이 무너졌다';$('card').querySelector('p').textContent='다시 도전해 전투와 패링을 익혀보자.';$('start').textContent='재도전';message('패배')}}
function rewind(){if(!started)return;const target=history.find(h=>clock-h.t>=2.8)||history[0];if(!target){message('되돌릴 시간이 부족하다');return}hero.position.copy(target.pos);hp=Math.min(100,Math.max(hp,target.hp));$('hp').style.width=hp+'%';fx(hero.position.x,hero.position.z,0x70d8ff);message('시간 역행 · 3초 전으로');history=[]}
const button=(id,down,up)=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('down');down()});const release=e=>{el.classList.remove('down');up?.()};el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release)};button('attack',()=>{charging=clock||.0001},()=>{if(charging){attack(clock-charging>.48);charging=0}});button('guard',()=>{guard=true;guardAt=clock},()=>guard=false);button('rewind',rewind);button('interact',()=>{if(portal.visible&&hero.position.distanceTo(portal.position)<3.2){finished=true;started=false;$('panel').style.display='flex';$('card').querySelector('h1').textContent='1층 정화 완료';$('card').querySelector('p').textContent='3D 전투 프로토타입을 클리어했어! 캐릭터, 검 공격, 방패 패링, 시간 역행과 3D 카메라가 동작하는 첫 시험장이야.';$('start').textContent='다시 플레이'}else message('빛나는 문에 더 가까이 가야 한다')});
const joy=$('joystick'),knob=$('knob');let joyId=null;function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),k=Math.min(1,len/49);stick.x=(len?dx/len:0)*k;stick.y=(len?dy/len:0)*k;knob.style.transform=`translate(${stick.x*42}px,${stick.y*42}px)`}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});const endJoy=e=>{if(e.pointerId!==joyId)return;joyId=null;stick={x:0,y:0};knob.style.transform=''};joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyJ'||e.code==='Space')attack(false);if(e.code==='KeyK'){guard=true;guardAt=clock}if(e.code==='KeyR')rewind();if(e.code==='KeyE')$('interact').click()});window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyK')guard=false});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const temp=new THREE.Vector3();function loop(){requestAnimationFrame(loop);let now=performance.now()/1000,dt=Math.min(.04,now-last);last=now;if(started){clock+=dt;let x=stick.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=stick.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);temp.set(x,0,z);if(temp.length()>1)temp.normalize();if(temp.lengthSq()>.01){hero.position.addScaledVector(temp,dt*(guard?2.5:5.4));facing.copy(temp).normalize();hero.rotation.y=Math.atan2(-facing.x,-facing.z);hero.children[0].position.y=Math.abs(Math.sin(clock*12))*.065}else hero.children[0].position.y=0;hero.position.x=THREE.MathUtils.clamp(hero.position.x,-11.4,11.4);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-11.4,11.4);hero.scale.lerp(new THREE.Vector3(1,1,1),dt*9);if(charging){const r=clock-charging;hero.scale.setScalar(1+Math.min(.15,r*.1));if(Math.random()<dt*16)fx(hero.position.x,hero.position.z,0x75caff)}if(guard){hero.scale.x=.94;hero.scale.z=.94}history.push({t:clock,pos:hero.position.clone(),hp});while(history.length&&clock-history[0].t>3.4)history.shift();for(const e of enemies){if(e.hp<=0)continue;const v=hero.position.clone().sub(e.root.position);v.y=0;const d=v.length();if(d>.1){e.root.rotation.y=Math.atan2(-v.x,-v.z)}if(e.wind>0){e.wind-=dt;e.root.scale.setScalar(1+Math.sin(clock*35)*.055);if(e.wind<=0){e.root.scale.setScalar(1);if(d<(e.type==='lancer'?4.3:2.6))hurt(e.type==='lancer'?25:17,e);e.cd=e.type==='archer'?1.5:1.15}}else{e.cd-=dt;const range=e.type==='archer'?7:e.type==='lancer'?3.4:1.8;if(d>range&&d>.1)e.root.position.addScaledVector(v.normalize(),dt*(e.type==='lancer'?2.5:1.9));else if(e.cd<=0){e.wind=e.type==='archer'?.58:e.type==='lancer'?.78:.42;e.cd=3;fx(e.root.position.x,e.root.position.z,0xffb76b)}}}if(clock>messageUntil)$('msg').textContent=''}portal.rotation.y+=dt*.7;ring.rotation.z+=dt*.6;for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;e.m.position.addScaledVector(e.v,dt);e.v.y-=dt*8;e.m.material.opacity=Math.max(0,e.life*1.6);if(e.life<=0){scene.remove(e.m);effects.splice(i,1)}}parryGlow=Math.max(0,parryGlow-dt);hitFlash=Math.max(0,hitFlash-dt);if(hero){const focus=hero.position;const off=innerWidth<innerHeight?new THREE.Vector3(0,19,19):new THREE.Vector3(0,15,16);camera.position.lerp(focus.clone().add(off),Math.min(1,dt*5));camera.lookAt(focus.x,0,focus.z-1)}else{camera.position.set(0,18,20);camera.lookAt(0,0,0)}renderer.render(scene,camera)}loop();
</script></body></html>
